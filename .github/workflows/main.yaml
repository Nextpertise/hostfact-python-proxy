name: main
on: push

jobs:
  test:
    runs-on: public-runners
    container:
      image: python:3.11

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Poetry
      run: |
        pip install poetry
        poetry install
        poetry run pytest

  build_docker_image:
    runs-on: public-runners
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: registry.nextpertise.tools
          username: ${{ secrets.REGISTRY_NEXTPERTISE_TOOLS_PUBLIC_ACCOUNT }}
          password: ${{ secrets.REGISTRY_NEXTPERTISE_TOOLS_PUBLIC_KEY }}

      - name: Set context
        run: echo "context=$(pwd)" >> $GITHUB_ENV

      - name: Push image to registry
        uses: docker/build-push-action@v5
        with:
          file: ./Dockerfile
          context: ${{ env.context }}/
          push: true
          tags: |
            registry.nextpertise.tools/nextpertise/hostfact-python-proxy:latest
            registry.nextpertise.tools/nextpertise/hostfact-python-proxy:${{ github.ref_name }}